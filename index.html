<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />

  <title>Multimeter-Simulation</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
    }
	
	
	#multimeter-case {
      width: 450px;
      height: 660px;
      margin: 40px auto 0 auto;
      background: #384b4c;
      border-radius: 18px;
      border: 8px solid #444;
      position: relative;
    }
	
	
    #multimeter-container {
      width: 450px;
      height: 270px;
      background: #eee;
      border-top-left-radius: 18px;
      border-top-right-radius: 18px;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border: 2px solid #444;
      position: absolute;
	  left: -2px;
	  top: -2px;
    }
	
	#needle {
      width: 2px;
      height: 240px;
      background: red;
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) rotate(-50deg);
      transform-origin: bottom center;
      pointer-events: none;
    }
	
    #dial1 {
      width: 300px;
      height: 150px;
      position: absolute;
      left: 50%;
      top: 120px;
      transform: translate(-50%, 0);
      pointer-events: none;
    }
    #dial2 {
      width: 300px;
      height: 170px;
      position: absolute;
      left: 50%;
      top: 100px;
      transform: translate(-50%, 0);
      pointer-events: none;
    }
	
	 #dial3 {
      width: 300px;
      height: 200px;
      position: absolute;
      left: 50%;
      top: 70px;
      transform: translate(-50%, 0);
      pointer-events: none;
    }
	
	 #dial4 {
      width: 300px;
      height: 230px;
      position: absolute;
      left: 50%;
      top: 40px;
      transform: translate(-50%, 0);
      pointer-events: none;
    }
	
	#blackmarkbox {
      width: 300px;
      height: 170px;
      position: absolute;
      left: 50%;
      top: 100px;
      transform: translate(-50%, 0);
      pointer-events: none;
    }
	
	#blackmark {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 300px;
      height: 150px;
      pointer-events: none;
    }
	
	#svg {
      position: absolute;
	  pointer-events: none;
    }
    
	
	#graymarkbox {
      width: 300px;
      height: 170px;
      position: absolute;
      left: 50%;
      top: 100px;
      transform: translate(-50%, 0);
      pointer-events: none;
    }
	
	
	#graymark {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 300px;
      height: 150px;
      pointer-events: none;
    }
    
    #scale1 {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 300px;
      height: 150px;
      pointer-events: none;
    }
	
    #scale2 {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 300px;
      height: 150px;
      pointer-events: none;
    }
	
	#scale3 {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 300px;
      height: 150px;
      pointer-events: none;
    }
	
	#scale4 {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 300px;
      height: 150px;
      pointer-events: none;
    }
	
	.gray-mark {
	  position: absolute;
      left: 50%;
      bottom: 0;
      width: 5px;
      background: silver;
      transform-origin: bottom center;
      height: 5px;
	}
	
	.black-mark {
	  position: absolute;
      left: 50%;
      bottom: 0;
      width: 6px;
      background: #333;
      transform-origin: bottom center;
      height: 1px;
	}
	
    .scale-mark {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 2px;
      background: #333;
      transform-origin: bottom center;
    }
	
	.scale-mark-small {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 1px;
      background: #333;
      transform-origin: bottom center;
    }
	
    .main-mark {
      height: 22px;
    }
    .sub-mark {
      height: 10px;
    }
    .main-mark-neg {
      height: 16px;
    }
    .sub-mark-neg {
      height: 9px;
    }
    .scale-label {
      position: absolute;
      left: 50%;
      bottom: 0;
      font-size: 16px;
      font-weight: bold;
      pointer-events: none;
    }
	.scale-label-small {
      position: absolute;
      left: 50%;
      bottom: 0;
      font-size: 10px;
      font-weight: bold;
      pointer-events: none;
    }
    #output {
	  width: 261px;
      height:26px;
      top: 272px; 
      font-size: 25px;
	  left: 127px;
	  padding: 10px 30px;
	  border: 2px solid #444;
	  background: #eee;
	  position: absolute;
    }
    .button1 {
	  position: absolute;
	  width: 130px;   
      height: 50px; 
      font-size: 20px;
	  padding: 10px 30px;
      top: 272px;
	  left: -2px;
      border: 2px solid #444;
	  background: #eee;
	  cursor: pointer;
	  transition: all 0.2s ease;
    }
	
	.button1:hover {
	  background-color: #139135;
	}
	
	.runde-buttons {
	  position: absolute;
	  width: 40px;        /* oder andere gewünschte Größe */
	  height: 40px;       /* gleiche Höhe wie Breite ergibt einen Kreis */
	  background-color: black;
	  top: 330px;
	  left: 40px;
	  color: white;
	  border: none;
	  border-radius: 50%; /* macht runde Buttons */
	  cursor: pointer;
	  font-size: 16px;      
	  transition: all 0.2s ease;
	}

	.runde-buttons:hover {
	  background-color: #0c6263;
	}

    #rotary-container {
      width: 200px;
      height: 200px;
      margin: 40px auto;
      position: absolute;
      left: 50%;
      top: 340px;
      transform: translate(-50%, 0) rotate(48deg);
    }
    #rotary-knob {
      width: 216px;
      height: 216px;
      background: #333;
      border-radius: 50%;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) ;
      cursor: pointer;
	  border: 4px solid black;
    }
    #rotary-pointer {
      width: 4px;
      height: 60px;
      background: white;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 2px;
    }
	
	#rotary-pointer2 {
      width: 15px;
      height: 180px;
      background: black;
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%) translateY(-2px);
      border-radius: 2px;
    }
	
    .rotary-mark {
      position: absolute;
      width: 4px;
      height: 20px;
      background: white;
      top: 0;
      left: 98px;
      transform-origin: center 100px;
    }
    .rotary-label {
      position: absolute;
      font-size: 12px;
      font-weight: bold;
      color: white;
      top: 50%;
      left: 50%;
      transform-origin: center center;
      white-space: nowrap;
    }
  </style>

  <script>
    const needle = document.getElementById('needle');
    const scale1 = document.getElementById('scale1');
    const scale2 = document.getElementById('scale2');
	const scale3 = document.getElementById('scale3');
    const scale4 = document.getElementById('scale4');
    const output = document.getElementById('output');
    const startAngle = -50; // links
    const endAngle = 50; // rechts
	
	const startAngle3 = -56;
	const startAngle4 = -54;
    
    let currentAngle = startAngle;
    let currentValue = 0;

    function deg2rad(angle) { return angle * Math.PI / 180; }

    //Skala1 0-5 
    function generatescale1() {
	  const divisions = 5;
	  // Hauptstriche
      for (let i = 0; i <= divisions; i++) {
        const angle = startAngle + ((endAngle - startAngle) / divisions) * i;
        const mark = document.createElement('div');
        mark.className = 'scale-mark main-mark';
        mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-215px)`;
        scale1.appendChild(mark);
        // Label oben an den Strichen
        const label = document.createElement('div');
        label.className = 'scale-label';
        label.textContent = i;
        label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-238px) rotate(${-angle}deg)`;
        scale1.appendChild(label);
        // Zwischenstriche
        if (i < divisions) {
          for (let j = 1; j < 10; j++) {
            const subAngle = angle + ((endAngle - startAngle) / divisions) * (j / 10);
            const subMark = document.createElement('div');
            subMark.className = 'scale-mark sub-mark';
            if (j === 5) {
              subMark.style.height = '16px';
            } else {
              subMark.style.height = '10px';
            }
            subMark.style.transform = `translate(-50%,0) rotate(${subAngle}deg) translateY(-215px)`;
            scale1.appendChild(subMark);
          }
        }
      }
    }	
	
    //Skala2 0-15 )
    function generatescale2() {
      const step = 0.2;
      const maxVal = 15.8;
      const division2 = maxVal / step; 
      // Hauptstriche
      for (let i = 0; i <= division2; i++) {
        const val = i * step;
        const angle = startAngle + ((endAngle - startAngle) / division2) * i;
        const mark = document.createElement('div');
        mark.className = 'scale-mark';

        // Längere Striche bei ganzen Zahlen
        if (val % 1 === 0) {
          mark.classList.add('main-mark');
		  mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-178px)`;
        } else {
          mark.classList.add('sub-mark');
		  mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-190px)`;
        }
        scale2.appendChild(mark);

        // Nur Zahlen bei 0,5,10,15 unten an den Strichen
        if (val === 0 || val === 5 || val === 10 || val === 15) {
          const label = document.createElement('div');
          label.className = 'scale-label';
          label.textContent = val.toString();
		  if (val === 0) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-158px) translatex(-6px)`; // -155
		  }
		  if (val === 5) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-158px) translatex(-3px)`; // -155
		  }
		  if (val === 10) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-158px) translatex(1px)`; // -155
		  }
		  if (val === 15) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-161px) translatex(8px)`; // -155
		  }
          scale2.appendChild(label);
        }
      }
    }
	
	function generatescale3() {
      const step = 0.1;
      const maxVal = 5;
      const division2 = maxVal / step; 
      // 0 als Sonderfall
	  const label = document.createElement('div');
      label.className = 'scale-label-small';
      label.textContent = "0";
	  label.style.transform = `translate(-50%,0) rotate(${-50}deg) translateY(-145px) translatex(-4px)`; // -155
	  scale3.appendChild(label);
	  const mark = document.createElement('div');
      mark.className = 'scale-mark main-mark-neg';
	  mark.style.transform = `translate(-50%,0) rotate(${-50}deg) translateY(-127px)`;
	  scale3.appendChild(mark);
	  
	  // Hauptstriche
      for (let i = 5; i <= division2; i++) {
        const val = i * step;
        const angle = startAngle3 + ((endAngle - startAngle3) / division2) * i;
        const mark = document.createElement('div');
        mark.className = 'scale-mark';

        // Längere Striche bei ganzen Zahlen
        if (val % 0.5 === 0) {
          mark.classList.add('main-mark-neg');
		  mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-127px)`;
        } else {
          mark.classList.add('sub-mark-neg');
		  mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-127px)`;
        }
        scale3.appendChild(mark);

        
        if (val === 1 || val === 2 || val === 3 || val === 4 || val === 5) {
          const label = document.createElement('div');
          label.className = 'scale-label-small';
          label.textContent = val.toString();
		  if (val === 1) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-145px) translatex(-3px)`; // -155
		  }
		  if (val === 2) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-145px) translatex(-1px)`; // -155
		  }
		  if (val === 3) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-145px) translatex(1px)`; // -155
		  }
		  if (val === 4) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-145px) translatex(2px)`; // -155
		  }
		  if (val === 5) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-145px) translatex(5px)`; // -155
		  }
          scale3.appendChild(label);
        }
      }
    }
	
    function generatescale4() {
      const step = 0.2;
      const maxVal = 15.8;
      const division2 = maxVal / step ; 
	  
	  //0 als Sonderfall
	  const mark = document.createElement('div');
      mark.className = 'scale-mark-small main-mark';
	  mark.style.transform = `translate(-50%,0) rotate(${-50}deg) translateY(-98px)`;
	  scale4.appendChild(mark);
	  const label = document.createElement('div');
      label.className = 'scale-label-small';
      label.textContent = "0";
	  label.style.transform = `translate(-50%,0) rotate(${-50}deg) translateY(-88px) translatex(-4px)`; // -155
	  scale4.appendChild(label);
	  
      // Hauptstriche
      for (let i = 5; i <= division2; i++) {
        const val = i * step;
        const angle = startAngle4 + ((endAngle - startAngle4) / division2) * i;
        const mark = document.createElement('div');
        mark.className = 'scale-mark-small';
		
        // Längere Striche bei ganzen Zahlen
        if (val % 1 === 0) {
          mark.classList.add('main-mark');
		  mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-98px)`;
        } else {
          mark.classList.add('sub-mark');
		  mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-110px)`;
        }
        scale4.appendChild(mark);

       
        if (val === 5 || val === 10 || val === 15) {
          const label = document.createElement('div');
          label.className = 'scale-label-small';
          label.textContent = val.toString();
		  if (val === 5) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-86px) translatex(-2px)`; // -155
		  }
		  if (val === 10) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-87px) translatex(1px)`; // -155
		  }
		  if (val === 15) {
          label.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-89px) translatex(5px)`; // -155
		  }
          scale4.appendChild(label);
        }
      }
    }
	
	
	
	// grauer balken
	function generategraymark() {
	  const divisions = 100
	  // Hauptstriche
      for (let i = 0; i <= divisions; i++) {
        const angle = startAngle + ((endAngle - startAngle) / divisions) * i;
        const mark = document.createElement('div');
        mark.className = 'gray-mark';
        mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-205px)`;
        graymark.appendChild(mark);
      }
    }
	
	// schwarze balken1
	function generateblackmark1() {
	  const divisions = 85
	  // Hauptstriche
      for (let i = 1; i <= divisions-1; i++) {
        const angle = startAngle + ((endAngle - startAngle) / divisions) * i;
        const mark = document.createElement('div');
        mark.className = 'black-mark';
        mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-127px)`;
        blackmark.appendChild(mark);
      }
    }
	
	// schwarze balken2
	function generateblackmark2() {
	  const divisions = 85
	  // Hauptstriche
      for (let i = 1; i <= divisions-1; i++) {
        const angle = startAngle + ((endAngle - startAngle) / divisions) * i;
        const mark = document.createElement('div');
        mark.className = 'black-mark';
        mark.style.transform = `translate(-50%,0) rotate(${angle}deg) translateY(-119px)`;
        blackmark.appendChild(mark);
      }
    }
	
	
	// Setze Nadelwinkel basierend auf Wert (Skala 0–5)
    function setNeedleByValue(val) {
	  const divisions = 5; // Skala 0–5
      const angle = startAngle + (endAngle - startAngle) * (val / divisions);
      setNeedleAngle(angle);
    }

    // Nadel bewegen (Winkel in Grad)
    function setNeedleAngle(angle) {
	  const divisions = 5; // Skala 0–5

      const value = (angle - startAngle) / (endAngle - startAngle) * divisions;
      currentValue = Math.round(value * 1000) / 1000;
    }

    // Nadel an Klick-Stelle setzen
    function setNeedleOnClick(event) {
      const container = document.getElementById('dial1');
      const rect = container.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.bottom; // Mittelpunkt unten
      const dx = event.clientX - cx;
      const dy = cy - event.clientY;
      let angle = Math.atan2(dx, dy) * 180 / Math.PI;
      if (angle < -90) angle += 360; // Normalisieren
      if (angle < startAngle) angle = startAngle;
      if (angle > endAngle) angle = endAngle;
      setNeedleAngle(angle);
    }

    const rotaryContainer = document.getElementById('rotary-container');
